<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Čelovka - Inspirováno Partičkou</title>
    <!-- Odkaz na PWA manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .top-buttons {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 500px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }

        .cat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
            text-align: center;
        }

        .cat-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .toggle-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.65rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .toggle-btn.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
            font-weight: 700;
        }

        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* Diskrétní odkaz na kávu dole */
        .coffee-footer {
            text-align: center;
            margin-top: 1rem;
        }

        .coffee-link {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .coffee-link:hover {
            color: #f59e0b;
        }

        .game-screen, .result-screen {
            display: none;
            text-align: center;
        }

        .word-display-box {
            background: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            gap: 1.5rem;
        }

        .word-title {
            font-size: 2.6rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            word-break: break-word;
        }

        .word-category {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .skip-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .skip-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: #475569;
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .eval-btn {
            flex: 1;
            padding: 1.2rem;
            border-radius: 16px;
            border: none;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            transition: transform 0.1s ease;
        }

        .eval-btn:active {
            transform: scale(0.96);
        }

        .btn-uhadl {
            background: var(--accent-red);
            box-shadow: 0 8px 20px -4px rgba(239, 68, 68, 0.4);
        }

        .btn-neuhadl {
            background: var(--accent-green);
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
        }

        .result-box {
            padding: 2rem 1.5rem;
            background: #0f172a;
            border-radius: 20px;
            margin: 1.5rem 0;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .result-box.win {
            border-color: var(--accent-green);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
        }

        .result-box.lose {
            border-color: var(--accent-red);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
        }

        .result-text {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .result-line-1 {
            font-size: 1.35rem;
            font-weight: 800;
        }

        .result-line-2 {
            font-size: 1.05rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .result-text.win .result-line-1,
        .result-text.win .result-line-2 {
            color: var(--accent-green);
        }

        .result-text.lose .result-line-1,
        .result-text.lose .result-line-2 {
            color: var(--accent-red);
        }

        .score-board {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            width: 100%;
            max-width: 320px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
        }

        .score-divider {
            font-size: 1.5rem;
            color: var(--border-color);
            font-weight: 300;
        }

        .guessed-word-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .guessed-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .guessed-word-tag {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .action-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-next {
            background: var(--accent-blue);
            color: white;
        }

        .btn-menu {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- MENU SCREEN -->
        <div id="menuScreen">
            <div class="top-buttons">
                <button class="icon-btn" onclick="shareApp()" title="Sdílet hru">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                </button>
            </div>

            <header>
                <h1>Čelovka</h1>
                <p class="subtitle">Inspirováno TV pořadem Partička</p>
            </header>

            <div class="categories-grid">
                <!-- Reálné postavy -->
                <div class="cat-card">
                    <div class="cat-title">👤 Reálné postavy</div>
                    <div class="options-group">
                        <button class="toggle-btn active" id="btnRealCzech" onclick="toggleOption('realCzech')">České</button>
                        <button class="toggle-btn active" id="btnRealForeign" onclick="toggleOption('realForeign')">Zahraniční</button>
                    </div>
                </div>

                <!-- Filmové postavy -->
                <div class="cat-card">
                    <div class="cat-title">🎬 Filmové postavy</div>
                    <div class="options-group">
                        <button class="toggle-btn active" id="btnFictionalLive" onclick="toggleOption('fictionalLive')">Hrané</button>
                        <button class="toggle-btn active" id="btnFictionalFairy" onclick="toggleOption('fictionalFairy')">Pohádky</button>
                        <button class="toggle-btn active" id="btnFictionalAnimated" onclick="toggleOption('fictionalAnimated')">Animované</button>
                    </div>
                </div>
            </div>

            <div class="menu-actions">
                <button class="start-btn" onclick="startGame()">SPUSTIT HRU</button>
                <div class="coffee-footer">
                    <!-- Tady si změň odkaz na své BMC / Kofi / Revolut -->
                    <a class="coffee-link" href="https://buymeacoffee.com/tvujprofil" target="_blank">
                        ☕ Podpořit vývoj kávou
                    </a>
                </div>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" class="game-screen">
            <button class="icon-btn" style="position: absolute; top: 1.5rem; right: 1.5rem;" onclick="showMenu()" title="Hlavní menu">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
            <header>
                <h1 style="font-size: 1.8rem;">Čelovka</h1>
                <p class="subtitle">Spoluhráč hádá – ty ovládáš hru</p>
            </header>

            <div class="word-display-box">
                <div>
                    <div class="word-category" id="displayCategory">KATEGORIE</div>
                    <div class="word-title" id="displayWord" style="margin-top: 0.5rem;">Jméno Postavy</div>
                </div>
                <button class="skip-btn" onclick="nextRound()">⏩ Přeskočit postavu</button>
            </div>

            <div class="game-controls">
                <button class="eval-btn btn-uhadl" onclick="evaluateRound(true)">UHÁDL</button>
                <button class="eval-btn btn-neuhadl" onclick="evaluateRound(false)">NEUHÁDL</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="result-screen">
            <header>
                <h1 style="font-size: 1.8rem;">VÝSLEDEK</h1>
            </header>

            <div class="result-box" id="resultBox">
                <div class="result-text" id="resultText">
                    <span class="result-line-1" id="line1">První řádek</span>
                    <span class="result-line-2" id="line2">Druhý řádek</span>
                </div>

                <div class="score-board">
                    <div class="score-item">
                        <span class="score-label">TY</span>
                        <span class="score-value" id="scoreUser">0</span>
                    </div>
                    <span class="score-divider">:</span>
                    <div class="score-item">
                        <span class="score-label">SPOLUHRÁČ</span>
                        <span class="score-value" id="scorePeer">0</span>
                    </div>
                </div>

                <div class="guessed-word-container">
                    <span class="guessed-label">Hádaná postava</span>
                    <div class="guessed-word-tag" id="lastGuessedWord">-</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="action-btn btn-next" onclick="nextRound()">Další postava</button>
                <button class="action-btn btn-menu" onclick="showMenu()">Hlavní menu</button>
            </div>
        </div>
    </div>

    <script>
        // Registrace Service Workera pro PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        const database = {
            realCzech: [
                "Karel IV.", "Václav Havel", "Tomáš Garrigue Masaryk", "Jan Žižka", "Jan Amos Komenský",
                "Jan Hus", "Karel Havlíček Borovský", "Ludvík Svoboda", "Jan Palach", "Milada Horáková",
                "Karel Gott", "Božena Němcová", "Alfons Mucha", "Bedřich Smetana", "Antonín Dvořák",
                "Miloš Forman", "Otto Wichterle", "Karel Čapek", "Jaroslav Seifert", "Zdeněk Svěrák",

                "Jaromír Jágr", "Emil Zátopek", "Věra Čáslavská", "Martina Navrátilová", "Petr Čech",
                "Pavel Nedvěd", "Dominik Hašek", "Barbora Špotáková", "Ivan Lendl", "Roman Šebrle", 
                "Josef Váňa", "Kateřina Neumannová", "Leoš Mareš", "Jan Kraus", "Marek Eben", 
                "Lucie Borhyová", "Pavel Novotný", "Libor Bouček", "Richard Genzer", "Michal Suchánek",
                "Jan Neruda", "Ema Destinnová", "Emil Holub", "Josef Lada", "Zdeněk Miler", 
                "Jiřina Bohdalová", "Bolek Polívka", "Ivan Mládek"
            ],
            realForeign: [
                "Albert Einstein", "Leonardo da Vinci", "Isaac Newton", "Stephen Hawking", "Nikola Tesla",
                "Galileo Galilei", "Charles Darwin", "Pablo Picasso", "Vincent van Gogh", "Wolfgang Amadeus Mozart",
                "Ludwig van Beethoven", "William Shakespeare", "Marie Curie-Skłodowska", "Thomas Edison", "Alexander Graham Bell",
                "Cleopatra", "Napoleon Bonaparte", "Julius Caesar", "Královna Alžběta II.", "Barack Obama",
                "Winston Churchill", "Abraham Lincoln", "Alexander Veliký", "František Josef I.", "Mahátma Gándhí",
                "John F. Kennedy", "Martin Luther King", "Nelson Mandela",
                "Roger Federer", "Serena Williams", "Michael Schumacher", "Tiger Woods", "Wayne Gretzky",
                "Michael Jackson", "Steve Jobs", "Bill Gates", "Keanu Reeves", "Taylor Swift",
                "Arnold Schwarzenegger", "Gordon Ramsay", "Walt Disney", "Elvis Presley",
                "Madonna", "Tom Cruise", "Brad Pitt", "Leonardo DiCaprio", "Quentin Tarantino",
                "Rowan Atkinson", "Morgan Freeman", "Freddie Mercury", "Jim Carrey", 
                "Jackie Chan", "Bruce Lee", "Stephen King", "Steven Spielberg", 
                "Lewis Hamilton", "Usain Bolt", "Michael Jordan"
            ],
            fictionalFairy: [
                "Popelka", "Krakonoš", "Mrazík", "Zlatovláska", "Hloupý Honza", 
                "Princezna se zlatou hvězdou na čele", "Dlouhý", "Široký", "Bystrozraký",
                "Rumcajs", "Manka", "Křemílek", "Vochomůrka",
                "Princezna Jasněnka", "Rumburak", "Arabela", "Trautenberk",
                "Kubula a Kuba Kubikula", "Čertík Lucius", "Král Já I.",
                "Rytíř Brtník z Brtníku", "Bílá paní", "Vodník Kabourek",
                "Princ Bajaja", "Pyšná princezna", "Šíleně smutná princezna", "Děd Vševěd"
            ],
            fictionalAnimated: [
                "Krteček", "Pat", "Mat", "Spejbl", "Hurvínek", "Mach", "Šebestová", 
                "Škubánek", "Rákosníček", "Maxipes Fík", "Víla Amálka", 
                "Kocour Tom", "Myš Jerry", "Shrek", "Fiona", "Kocour v botách", "Homer Simpson",
                "Marge Simpsonová", "Bart Simpson", "Lisa Simpsonová", "Mickey Mouse", "Kačer Donald",
                "SpongeBob", "Patrik Hvězdice", "Blesk McQueen", "Mimoň",
                "Bugs Bunny", "Scooby-Doo", "Woody", "Buzz Rakeťák", "Garfield", 
                "Simba", "Stitch", "WALL-E", "Elsa", "Olaf", "Gru", "Medvídek Pú", "Tygr",
                "Nemo", "Asterix", "Obelix"
            ],
            fictionalLive: [
                "Harry Potter", "Lord Voldemort", "Hermiona Grangerová", "Ron Weasley", "Albus Brumbál",
                "James Bond", "Jack Sparrow", "Sherlock Holmes", "Dr. Watson", "Luke Skywalker",
                "Darth Vader", "Princezna Leia", "Han Solo", "Yoda", "Indiana Jones",
                "Tony Stark (Iron Man)", "Captain America", "Thor", "Hulk", "Spider-Man",
                "Joker", "Batman", "Superman", "Gandalf", "Gollum",
                "Legolas", "Aragorn", "Frodo Pytlík", "Forrest Gump", "Neo",
                "Morpheus", "Terminátor (T-800)", "Wolverine", "John Wick", "Rocky Balboa",
                "Rambo", "Dominic Toretto", "Ethan Hunt", "Zorro", "Tarzan",
                "Willy Wonka", "Jack Dawson", "Rose DeWitt Bukater", "Hannibal Lecter", "Norman Bates"
            ]
        };

        const winPairs = [
            { l1: "Skvělá práce!", l2: "Dobře jsi ho zmátl a udržel v omylu!" },
            { l1: "Perfektní defenzíva!", l2: "Spoluhráč byl úplně mimo." },
            { l1: "Geniální tah!", l2: "Tvoje nápovědy byly dokonale zavádějící." },
            { l1: "Vítězství!", l2: "Soupeř neměl šanci tvé kličky odhalit." }
        ];

        const losePairs = [
            { l1: "Odhalil tě!", l2: "Snažil ses ho zmátl, ale prokoukl to." },
            { l1: "Těsná prohra!", l2: "Spoluhráč byl příliš chytrý a odhalil tě." },
            { l1: "Au, vedle!", l2: "Příště musíš napovídat lépe a více ho zmátl." },
            { l1: "Prokoukl tě!", l2: "Soupeř i přes tvoje zmatení správně odpověděl." }
        ];

        let config = {
            realCzech: true,
            realForeign: true,
            fictionalLive: true,
            fictionalFairy: true,
            fictionalAnimated: true
        };

        let pool = [];
        let currentWordObject = null;
        let scoreUser = 0;
        let scorePeer = 0;

        function toggleOption(key) {
            config[key] = !config[key];
            const btnId = 'btn' + key.charAt(0).toUpperCase() + key.slice(1);
            document.getElementById(btnId).classList.toggle('active', config[key]);
        }

        function buildPool() {
            pool = [];
            if (config.realCzech) database.realCzech.forEach(w => pool.push({ word: w, cat: "Reálné postavy (CZ)" }));
            if (config.realForeign) database.realForeign.forEach(w => pool.push({ word: w, cat: "Reálné postavy (SVT)" }));
            if (config.fictionalLive) database.fictionalLive.forEach(w => pool.push({ word: w, cat: "Hrané filmové" }));
            if (config.fictionalFairy) database.fictionalFairy.forEach(w => pool.push({ word: w, cat: "Pohádky" }));
            if (config.fictionalAnimated) database.fictionalAnimated.forEach(w => pool.push({ word: w, cat: "Animované" }));
        }

        function getRandomWord() {
            if (pool.length === 0) buildPool();
            const index = Math.floor(Math.random() * pool.length);
            const selected = pool[index];
            pool.splice(index, 1);
            return selected;
        }

        function startGame() {
            buildPool();
            if (pool.length === 0) {
                alert("Prosím vyber alespoň jednu možnost!");
                return;
            }
            scoreUser = 0;
            scorePeer = 0;
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            nextRound();
        }

        function nextRound() {
            currentWordObject = getRandomWord();
            document.getElementById('displayWord').innerText = currentWordObject.word;
            document.getElementById('displayCategory').innerText = currentWordObject.cat;
            
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
        }

        function evaluateRound(guessed) {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';

            const resultBox = document.getElementById('resultBox');
            const textEl = document.getElementById('resultText');
            const line1 = document.getElementById('line1');
            const line2 = document.getElementById('line2');
            document.getElementById('lastGuessedWord').innerText = currentWordObject ? currentWordObject.word : '';

            if (guessed) {
                scorePeer++;
                resultBox.className = "result-box lose";
                textEl.className = "result-text lose";
                const pair = losePairs[Math.floor(Math.random() * losePairs.length)];
                line1.innerText = pair.l1;
                line2.innerText = pair.l2;
            } else {
                scoreUser++;
                resultBox.className = "result-box win";
                textEl.className = "result-text win";
                const pair = winPairs[Math.floor(Math.random() * winPairs.length)];
                line1.innerText = pair.l1;
                line2.innerText = pair.l2;
            }

            document.getElementById('scoreUser').innerText = scoreUser;
            document.getElementById('scorePeer').innerText = scorePeer;
        }

        function showMenu() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'block';
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'Čelovka',
                    text: 'Zahraj si s námi skvělou hru Čelovka inspirovanou Partičkou!',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Odkaz na hru byl zkopírován do schránky!");
            }
        }
    </script>
</body>
</html>
